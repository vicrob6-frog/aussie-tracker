<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aussie Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F7;--surface:#fff;--ink:#0B1B3A;--mute:#55637F;--line:#CDD5E4;--pitch:#0B1F4B;--gold:#D62839;--bar:#EC5F7C;--off:#DCE2EE;--warn:#FDE8EA;--warnink:#7A1420;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08122A;--surface:#101E3E;--ink:#E8EDF7;--mute:#97A6C4;--line:#243A66;--pitch:#E5384A;--gold:#FF5A6B;--bar:#FF86A0;--off:#1F3159;--warn:#3a1219;--warnink:#ffc9cf}}
:root[data-theme="dark"]{--bg:#08122A;--surface:#101E3E;--ink:#E8EDF7;--mute:#97A6C4;--line:#243A66;--pitch:#E5384A;--gold:#FF5A6B;--bar:#FF86A0;--off:#1F3159;--warn:#3a1219;--warnink:#ffc9cf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
.note{background:var(--warn);color:var(--warnink);padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:24px}
h1{font:800 clamp(30px,6vw,52px)/1.02 Archivo,sans-serif;font-stretch:80%;letter-spacing:-.01em;margin:0 0 6px}
.lede{font-size:18px;color:var(--mute);margin:0 0 22px;max-width:60ch}
.lede b{color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.controls label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
select,input{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:140px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font:700 22px/1.2 Archivo,sans-serif;font-stretch:85%;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 span{font-weight:400;font-size:15px;color:var(--mute)}
.grid{display:flex;flex-direction:column;gap:10px}
.card{background:(--surface);border:1px solid (--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:72px minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center}
.card.on{border-left:5px solid (--gold)}
.name{font:700 19px/1.2 Archivo,sans-serif;font-stretch:90%}
.sub{font-size:14px;color:(--mute)}
.photo{width:64px;height:64px;border-radius:50%;background:(--off);color:(--mute);display:flex;align-items:center;justify-content:center;font:700 22px/1 Archivo,sans-serif;font-stretch:85%;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.strip{display:flex;gap:8px;height:128px}
.b{flex:1;display:flex;flex-direction:column;min-width:0;font-size:12px;color:(--mute);text-align:center}
.b .t{flex:1;display:flex;align-items:flex-end;margin:2px 0}
.b .v{color:(--ink);font-weight:600}
.b>span:last-child{white-space:nowrap;font-size:11px;line-height:1.2;overflow:hidden}
.b i{display:block;width:100%;background:(--bar);border-radius:3px 3px 0 0;min-height:3px}
.b i.z{background:(--off)}
.cap{font-size:12px;color:(--mute);margin-top:6px}
@media (max-width:720px){.card{grid-template-columns:60px 1fr}.photo{width:52px;height:52px;font-size:18px}.card .right{grid-column:1/-1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;border-top:1px solid (--line);padding-top:10px}
.stats strong{display:block;font:700 20px/1.1 Archivo,sans-serif;font-stretch:85%}
.stats small{font-size:12px;color:(--mute)}
.last{font-size:14px;margin:8px 0 10px}
.season{font-size:13px;color:(--mute);margin-top:10px}
.nm{min-width:0}
.empty{color:(--mute);padding:20px 0}
.pc{display:flex;flex-direction:column;align-items:center;gap:8px}
.name{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cmp{display:inline-flex;align-items:center;gap:5px;font:400 13px/1 Archivo,sans-serif;color:var(--mute)}
.bd{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:hsl(var(--h) 45% 38%);color:#fff;font:700 9px/1 Archivo,sans-serif;flex:none}
.bd.sq{border-radius:5px}
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0 2px;font-size:15px}
.fx>span{display:inline-flex;align-items:center;gap:6px}
.sc{font:800 22px/1 Archivo,sans-serif;font-stretch:80%;padding:3px 8px;background:var(--off);border-radius:5px}
.rt{display:inline-block;min-width:34px;text-align:center;font:700 14px/1 Archivo,sans-serif;padding:4px 6px;border-radius:5px;color:#fff;background:#46557a}
.rt.hi{background:#1F8A4C}.rt.mid{background:#5d6b8a}.rt.lo{background:#B5541C}.rt.na{background:var(--off);color:var(--mute)}
.b .rt{font-size:11px;padding:3px 2px;min-width:0;margin-bottom:2px}
  .sortbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.sl{font:700 18px/1 Archivo,sans-serif;font-stretch:85%;margin-right:4px}
.sortbar button{font:600 16px/1 Archivo,sans-serif;padding:12px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sortbar button[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--bg)}
.controls{flex-direction:column;align-items:flex-start;gap:12px}
.fg{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fl{font:700 14px/1 Archivo,sans-serif;font-stretch:85%;min-width:104px;margin-right:2px}
.fg button{font:600 14px/1 Archivo,sans-serif;padding:8px 13px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fg button[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--bg)}
.controls input{border-radius:999px;border-width:2px;padding:9px 15px;width:min(100%,340px)}
.controls{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 12px}
.dd{display:inline-flex;align-items:center;gap:8px;font:700 14px/1 Archivo,sans-serif;font-stretch:85%}
.dd select{font:600 14px/1 Archivo,sans-serif;font-stretch:100%;min-width:0;padding:9px 14px;border-radius:999px;border:2px solid var(--line);cursor:pointer}
.controls{position:relative}
.dd2{position:relative}
.pill{font:600 14px/1 Archivo,sans-serif;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pill[data-on="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--bg)}
.menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:100%;max-height:300px;overflow:auto;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.dd2.open .menu{display:block}
.menu button{display:block;width:100%;text-align:left;white-space:nowrap;font:500 14px/1.2 Archivo,sans-serif;padding:9px 12px;border:0;background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--off)}
.menu button[aria-selected="true"]{font-weight:700;background:var(--off)}
.bd{position:relative;overflow:hidden}
.bd img,.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:2px}
.photo{position:relative}.photo img{object-fit:cover;padding:0}
.b.cur{outline:2px solid #D62839;outline-offset:2px;border-radius:6px}
.bl{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:4px}
.bl .bd{width:26px;height:26px;font-size:9px}
.strip{height:200px}
.fx .me{font-weight:700;background:var(--off);border-radius:999px;padding:5px 12px 5px 8px;box-shadow:inset 0 0 0 2px var(--pitch)}
.card{background:#E1EEFC;border-color:#B9D2F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{background:var(--surface);border-color:var(--line)}}
:root[data-theme="dark"] .card{background:var(--surface);border-color:var(--line)}
  .b i{background:#EC5F7C}
@media (prefers-color-scheme:dark){.b i{background:#FF86A0}}
.b i.z{background:var(--off)}
</style>
</head>
<body>
<div class="wrap">
  <div class="note"><strong>Sample data.</strong> Minutes, goals and assists are placeholders so you can judge the design, and photos show initials for now. Live stats and photos will replace them once the daily update is connected.</div>
  <h1>Aussie Tracker</h1>
  <p class="lede" id="lede"></p>
  <div class="sortbar" role="group" aria-label="Sort players">
    <span class="sl">Sort by</span>
    <button type="button" data-s="date" aria-pressed="true">Latest match</button>
    <button type="button" data-s="rt" aria-pressed="false">Match rating</button>
    <button type="button" data-s="ga" aria-pressed="false">Goals + assists</button>
  </div>
  <div class="controls"><span id="fdd" style="display:contents"></span><input id="q" type="search" placeholder="Search player, club, opponent" aria-label="Search"></div>
  <div id="out"></div>
</div>
<script>
// name, club, league, position
var P=[
["Mathew Ryan","Levante","La Liga","GK"],["Jordan Bos","Feyenoord","Eredivisie","LB"],["Cameron Devlin","Rangers","Scottish Premiership","CDM"],
["Alessandro Circati","Benfica","Liga Portugal","CB"],["Cameron Burgess","Swansea City","Championship","CB"],["Riley McGree","Middlesbrough","Championship","LM"],
["Paul Izzo","Randers","Danish Superliga","GK"],["Cristian Volpato","Sassuolo","Serie A","RW"],["Harry Souttar","Leicester City","League One","CB"],
["Martin Boyle","Hibernian","Scottish Premiership","ST"],["Patrick Beach","Troyes","Ligue 1","GK"],["Gianni Stensness","Viking","Eliteserien","CB"],
["Kye Rowles","D.C. United","MLS","CB"],["Nestory Irankunda","Sporting CP","Liga Portugal","RM"],["Aiden O’Neill","New York City FC","MLS","CDM"],
["Mohamed Touré","Norwich City","Championship","ST"],["Kai Trewin","New York City FC","MLS","CB"],["Callum Elder","Lincoln City","Championship","LB"],
["Nick D’Agostino","Viking","Eliteserien","ST"],["Alex Robertson","Cardiff City","Championship","CDM"],["Connor Metcalfe","FC St. Pauli","2. Bundesliga","CM"],
["Noah Botić","Austria Wien","Austrian Bundesliga","ST"],["Jed Drew","Hartberg","Austrian Bundesliga","RW"],["Jacob Italiano","Grazer AK","Austrian Bundesliga","LW"],
["Marco Tilio","Rapid Wien","Austrian Bundesliga","LW"],["Ryan Teague","Mechelen","Jupiler Pro League","CB"],["Garang Kuol","Jablonec","Czech First League","ST"],
["Marcus Younis","Brondby","Danish Superliga","LW"],["Lucas Herrington","Hull City","Premier League","CB"],["Kealey Adamson","Queens Park Rangers","Championship","CM"],
["Joe Gauci","Lincoln City","Championship","GK"],["Lewis Miller","Blackburn Rovers","Championship","RB"],["Thomas Waddingham","Portsmouth","Championship","ST"],
["Raphael Borges Rodrigues","Burton Albion","League One","ST"],["Hayden Matthews","Bradford City","League One","CB"],["Ashley Maynard-Brewer","Sheffield Wednesday","League One","GK"],
["Sam Silvera","Milton Keynes Dons","League One","LW"],["Clayton Taylor","Barnsley","League One","LB"],["Paul Okon-Engstler","FC Koln","Bundesliga","CM"],
["Sam Klein","St. Pauli","2. Bundesliga","CM"],["Dylan Leonard","Alemannia Aachen","3. Liga","CM"],["Nishan Velupillay","Ingolstadt","3. Liga","LW"],
["Kasey Bos","Excelsior","Eredivisie","RW"],["Cameron Peupion","ADO Den Haag","Eredivisie","CB"],["Max Balard","NAC Breda","Eerste Divisie","LB"],
["Rhys Bozinovski","Heracles Almelo","Eerste Divisie","CM"],["Josh Nisbet","Roda JC Kerkrade","Eerste Divisie","RW"],["Keanu Baccus","St. Mirren","Scottish Premiership","CM"],
["Daniel Bennie","Dundee United","Scottish Premiership","LW"],["Jacob Chapman","St. Mirren","Scottish Premiership","RB"],["Jake Girdwood-Reich","Motherwell","Scottish Premiership","CB"],
["Jack Iredale","Hibernian","Scottish Premiership","CB"],["John Koutroumbis","Motherwell","Scottish Premiership","CB"],["Oscar Priestman","Motherwell","Scottish Premiership","CM"],
["Joshua Rawlins","Dundee United","Scottish Premiership","CB"],["Lachlan Rose","Dundee United","Scottish Premiership","CM"],["Zac Sapsford","Dundee United","Scottish Premiership","ST"],
["Ryan Strain","Falkirk","Scottish Premiership","RB"],["Dan Hall","JEF United Chiba","J1 League","CB"],["Jackson Irvine","Cerezo Osaka","J1 League","CM"],
["Kusini Yengi","Sanfrecce Hiroshima","J1 League","ST"],["Tete Yengi","Machida Zelvia","J1 League","ST"],["Alex Bonetig","Portland Timbers","MLS","ST"],
["Archie Goodwin","Charlotte FC","MLS","LW"],["Luka Jovanovic","San Jose Earthquakes","MLS","ST"],["Ariath Piol","Real Salt Lake","MLS","CM"],
["Patrick Yazbek","Nashville SC","MLS","LW"]];

var OPP=["Northgate","Riverside","Harbour Town","Eastfield","Westbridge","Kingsmoor","Stonebrook","Ashdown","Marlow Rovers","Highcliffe"];
function rng(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
return function(){h+=0x6D2B79F5;var t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}

// Sample generator. Replace with: fetch("players.json") once the daily script exists.
function build(p){
  var r=rng(p[0]),gk=p[3]==="GK",att=/ST|RW|LM|RM|CAM/.test(p[3]),d=Math.floor(r()*16),m=[];
  for(var i=0;i<5;i++){
    var played=r()>.22,min=played?Math.round(15+r()*75):0;
    var home=r()>.5,cup=r()<.18,g=!gk&&played&&r()<(att?.28:.08)?1:0,a=!gk&&played&&r()<(att?.2:.1)?1:0,tf=Math.max(g,a?1:0,Math.floor(r()*3)),ta=Math.floor(r()*3);
    m.push({d:d,min:min,g:g,a:a,yc:played&&r()<.12?1:0,home:home,comp:cup?"Cup":p[2],opp:OPP[Math.floor(r()*OPP.length)],tf:tf,ta:ta,
      sv:gk&&played?Math.floor(r()*7):0,cs:gk&&played&&ta===0?1:0,rt:played?Math.min(10,5.9+r()*2+g*.6+a*.4).toFixed(1):null});
    d+=3+Math.floor(r()*5);
  }
  var apps=6+Math.floor(r()*6);
  return {n:p[0],c:p[1],l:p[2],pos:p[3],gk:gk,m:m,
    ss:{apps:apps,min:apps*Math.round(55+r()*30),g:gk?0:Math.floor(r()*(att?6:2)),a:gk?0:Math.floor(r()*(att?4:2)),sv:gk?Math.floor(apps*(2+r()*2)):0}};
}
var D=P.map(build);
function prep(L){L.forEach(function(x){x.last=x.m.filter(function(g){return g.min>0})[0]||null;x.min5=x.m.reduce(function(s,g){return s+g.min},0);x.ga5=x.m.reduce(function(s,g){return s+g.g+g.a},0)})}
prep(D);

var $=function(i){return document.getElementById(i)};
var lgs=["All leagues"].concat(D.map(function(x){return x.l}).filter(function(v,i,a){return a.indexOf(v)===i}).sort());
var today=new Date();
function fmt(daysAgo){var t=new Date(today);t.setDate(t.getDate()-daysAgo);return t.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})}
function sd(n){var t=new Date(today);t.setDate(t.getDate()-n);return t.getDate()+"-"+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][t.getMonth()]}
function ago(n){return n===0?"today":n===1?"yesterday":n+" days ago"}

function initials(n){return n.split(" ").map(function(w){return w[0]}).slice(0,2).join("")}
function hue(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return h}
function code(t){var w=t.replace(/[^A-Za-z. ]/g,"").split(" ").filter(Boolean);return(w.length>1?w.map(function(x){return x[0]}).join(""):w[0].slice(0,3)).toUpperCase().slice(0,3)}
function img(u){return u?'<img src="'+u+'" alt="" onerror="this.remove()">':''}
function badge(t,sq,logo){return '<span class="bd'+(sq?" sq":"")+'" style="--h:'+hue(t)+'" role="img" aria-label="'+t+' badge">'+code(t)+img(logo)+'</span>'}
function rcls(r){return r>=7.5?"hi":r>=6.5?"mid":"lo"}
function rpill(r){return r?'<span class="rt '+rcls(+r)+'" title="Match rating">'+r+'</span>':'<span class="rt na" title="Did not play">–</span>'}
  function card(x,on,l){
  var bars=x.m.slice(0,5).reverse().map(function(g){
    var h=g.min?Math.max(8,Math.round(g.min/90*100)):6;
    return '<div class="b'+(g===l?' cur':'')+'" title="'+fmt(g.d)+': '+(g.min?g.min+" min, rated "+g.rt:"did not play")+'"><span class="bl">'+badge(g.comp||"?",0,g.compLogo)+badge(g.opp||"?",1,g.oppLogo)+'</span><span class="v">'+(g.min||"–")+'</span><div class="t"><i class="'+(g.min?"":"z")+'" style="height:'+h+'%"></i></div>'+rpill(g.rt)+'<span>'+sd(g.d)+'</span></div>'}).join("");
  var mid;
  if(l){
    var T=badge(x.c,1,l.teamLogo||x.clubLogo)+' '+x.c,O=badge(l.opp,1,l.oppLogo)+' '+l.opp,sc='<strong class="sc">'+(l.home?l.tf+'–'+l.ta:l.ta+'–'+l.tf)+'</strong>';
    var st=x.gk?[[l.sv,"Saves"],[l.cs,"Clean sheet"],[l.min,"Minutes"]]:[[l.g,"Goals"],[l.a,"Assists"],[l.min,"Minutes"]];
    mid='<div class="fx">'+(l.home?'<span class="me" title="'+x.n+' plays for '+x.c+'">'+T+'</span>'+sc+'<span>'+O+'</span>':'<span>'+O+'</span>'+sc+'<span class="me" title="'+x.n+' plays for '+x.c+'">'+T+'</span>')+'</div>'+
      '<p class="last">Played <strong>'+ago(l.d)+'</strong> ('+fmt(l.d)+')'+(l.yc?', yellow card':'')+'</p>'+
      '<div class="stats">'+st.map(function(q){return '<div><strong>'+q[0]+'</strong><small>'+q[1]+'</small></div>'}).join("")+'</div>';
  } else mid='<p class="last">No minutes in the last 5 matches</p>';
  return '<article class="card'+(on?" on":"")+'"><div class="pc"><div class="photo" role="img" aria-label="Photo of '+x.n+'">'+initials(x.n)+img(x.photo)+'</div>'+(l?rpill(l.rt):'')+'</div>'+
    '<div class="nm"><div class="name">'+x.n+(l?'<span class="cmp">'+badge(l.comp,0,l.compLogo)+l.comp+'</span>':'')+'</div><div class="sub">'+x.pos+'</div>'+mid+
    '<div class="season">Season: '+x.ss.apps+' apps, '+x.ss.min+' min'+(x.gk?', '+x.ss.sv+' saves':', '+x.ss.g+' goals, '+x.ss.a+' assists')+'</div></div>'+
    '<div class="right"><div class="strip">'+bars+'</div><div class="cap">Last 5 matches, oldest to newest (this match outlined): competition, opponent, minutes, rating, date</div></div></article>';
}

var SORT="date";
$("q").addEventListener("input",render);
function render(){
  var w=WIN,mr=RT,q=$("q").value.trim().toLowerCase(),lg=LG,R=[];
  D.forEach(function(x){x.m.forEach(function(g){if(g.min>0)R.push({x:x,g:g})})});
  var rows=R.filter(function(r){var x=r.x,g=r.g;
    return(!lg||x.l===lg)&&(!mr||(g.rt&&+g.rt>=mr))&&g.d<=w&&(!q||(x.n+" "+x.c+" "+g.opp+" "+g.comp).toLowerCase().indexOf(q)>-1)});
  var val={rt:function(r){return r.g.rt?+r.g.rt:0},min:function(r){return r.g.min},ga:function(r){return r.g.g+r.g.a}};
  rows.sort(function(a,b){
    if(SORT==="name")return a.x.n.localeCompare(b.x.n)||a.g.d-b.g.d;
    if(SORT==="date")return a.g.d-b.g.d||val.rt(b)-val.rt(a)||a.x.n.localeCompare(b.x.n);
    return val[SORT](b)-val[SORT](a)||a.g.d-b.g.d||a.x.n.localeCompare(b.x.n)});
  $("lede").innerHTML='<b>'+D.filter(function(x){return x.last&&x.last.d<=7}).length+' of '+D.length+'</b> tracked players have played in the last 7 days. Each row is one match.';
  function list(a){return '<div class="grid">'+a.map(function(r){return card(r.x,1,r.g)}).join("")+'</div>'}
  var html="";
  if(SORT!=="date")html=list(rows);
  else{var g={};rows.forEach(function(r){(g[r.g.d]=g[r.g.d]||[]).push(r)});
    html=Object.keys(g).map(Number).sort(function(a,b){return a-b}).map(function(d){return '<h2>'+fmt(d)+' <span>'+ago(d)+'</span></h2>'+list(g[d])}).join("")}
  $("out").innerHTML=html||'<p class="empty">No matches found. Clear the search or filters.</p>';
}
var WIN=99,RT=0,LG="";
var F=[["Matches from",[[3,"Last 3 days"],[7,"Last 7 days"],[14,"Last 14 days"],[99,"All dates"]],99,function(v){WIN=+v}],
["League",lgs.map(function(l,i){return[i?l:"",i?l:"All leagues"]}),"",function(v){LG=v}]];
